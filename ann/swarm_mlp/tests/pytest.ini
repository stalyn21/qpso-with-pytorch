# Tests de swarm_mlp: `python -m pytest tests` desde swarm_mlp/. El ini vive aquí para que
# la raíz de pytest sea tests/ y no swarm_mlp/ (que es paquete de ann/).
# importlib: no importar ann/__init__.py (paper 1), que arrastra dependencias ajenas.
[pytest]
testpaths = .
addopts = --import-mode=importlib
